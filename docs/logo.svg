<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Headroom logo">
  <title>Headroom</title>
  <!-- Graphite tile: the app's dark window colour -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#21252B"/>
  <!-- Copper ceiling: the limit you set -->
  <rect x="20" y="28" width="88" height="8" rx="4" fill="#DC7A49"/>
  <!-- Teal bars: what the GPU does, always under the ceiling -->
  <rect x="23" y="72" width="16" height="32" rx="4" fill="#45C4CE" opacity="0.55"/>
  <rect x="45" y="54" width="16" height="50" rx="4" fill="#45C4CE" opacity="0.75"/>
  <rect x="67" y="62" width="16" height="42" rx="4" fill="#45C4CE" opacity="0.65"/>
  <rect x="89" y="46" width="16" height="58" rx="4" fill="#45C4CE"/>
</svg>
